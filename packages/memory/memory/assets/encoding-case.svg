<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Real UTF-8 debugging experience reused by a later task</title>
  <desc id="desc">Task A records the successful UTF-8 resolution as memory-17. Task B retrieves it using exact keywords.</desc>
  <rect width="1120" height="430" rx="24" fill="#0f172a"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="48" y="48" font-size="24" font-weight="700" fill="#f8fafc">A real debugging experience becomes a reusable few-shot</text>
    <rect x="48" y="78" width="486" height="300" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="76" y="116" font-size="18" font-weight="700" fill="#93c5fd">Task A · Windows Chinese file corruption</text>
    <text x="76" y="153" font-size="15" fill="#e2e8f0">PowerShell default encoding</text><text x="430" y="153" font-size="15" fill="#fda4af">failure</text>
    <text x="76" y="183" font-size="15" fill="#e2e8f0">Explicit UTF-8 read/write</text><text x="430" y="183" font-size="15" fill="#86efac">success</text>
    <path d="M290 203V230" stroke="#94a3b8" stroke-width="2"/>
    <rect x="76" y="230" width="410" height="118" rx="12" fill="#111827"/>
    <text x="96" y="260" font-size="16" font-weight="700" fill="#fbbf24">memory-17</text>
    <text x="96" y="288" font-size="14" fill="#cbd5e1">deepseek-harness · windows · encoding</text>
    <text x="96" y="314" font-size="14" fill="#cbd5e1">filesystem · typescript</text>
    <text x="96" y="337" font-size="13" fill="#86efac">Lesson: control source-file encoding explicitly.</text>
    <rect x="586" y="78" width="486" height="300" rx="18" fill="#1e293b" stroke="#475569"/>
    <text x="614" y="116" font-size="18" font-weight="700" fill="#c4b5fd">Task B · “Why is this TS file corrupted?”</text>
    <text x="614" y="158" font-size="14" fill="#cbd5e1">memory_search(global; deepseek-harness, encoding, typescript)</text>
    <path d="M829 178V214" stroke="#94a3b8" stroke-width="2"/>
    <rect x="650" y="214" width="358" height="48" rx="12" fill="#312e81"/><text x="829" y="244" text-anchor="middle" font-size="15" fill="#ede9fe">candidate: memory-17</text>
    <path d="M829 262V290" stroke="#94a3b8" stroke-width="2"/>
    <text x="829" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#86efac">memory_get → complete past resolution</text>
    <text x="829" y="346" text-anchor="middle" font-size="14" fill="#cbd5e1">Skip failed approaches. Reuse verified evidence.</text>
  </g>
</svg>
