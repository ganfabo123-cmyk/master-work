<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Experience Memory architecture</title>
  <desc id="desc">Three model-facing tools use MemoryService, which separates the Markdown Store from replaceable retrieval providers.</desc>
  <defs><marker id="a" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="1120" height="500" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <text x="560" y="42" font-size="23" font-weight="700" fill="#0f172a">Small V1, replaceable retrieval boundary</text>
    <text x="560" y="76" font-size="14" fill="#64748b">Model-facing tools</text>
    <g font-size="15" font-weight="650" fill="#0f172a">
      <rect x="180" y="94" width="210" height="54" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text x="285" y="127">memory_record</text>
      <rect x="455" y="94" width="210" height="54" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text x="560" y="127">memory_search</text>
      <rect x="730" y="94" width="210" height="54" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text x="835" y="127">memory_get</text>
      <rect x="405" y="195" width="310" height="64" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="560" y="234" font-size="18">MemoryService</text>
      <rect x="170" y="315" width="270" height="64" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="305" y="345">MemoryStore</text><text x="305" y="366" font-size="12" fill="#475569">source of truth</text>
      <rect x="680" y="315" width="270" height="64" rx="14" fill="#fef3c7" stroke="#f59e0b"/><text x="815" y="345">MemoryRetriever</text><text x="815" y="366" font-size="12" fill="#475569">candidate selection</text>
      <rect x="205" y="422" width="200" height="48" rx="12" fill="#ecfdf5" stroke="#86efac"/><text x="305" y="452">*_memory.md</text>
      <rect x="535" y="414" width="185" height="58" rx="12" fill="#fffbeb" stroke="#fbbf24"/><text x="628" y="438">KeywordRetriever</text><text x="628" y="458" font-size="12" fill="#475569">V1</text>
      <rect x="745" y="414" width="245" height="58" rx="12" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/><text x="868" y="438" fill="#475569">BM25 · Vector · Hybrid</text><text x="868" y="458" font-size="12" fill="#64748b">future</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"><path d="M285 148V174H535V190"/><path d="M560 148V190"/><path d="M835 148V174H585V190"/><path d="M500 259L330 310"/><path d="M620 259L790 310"/><path d="M305 379V417"/><path d="M790 379L670 409"/></g>
    <path d="M840 379L865 409" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  </g>
</svg>
