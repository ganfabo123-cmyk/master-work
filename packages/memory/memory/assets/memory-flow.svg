<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">Experience Memory core flow</title>
  <desc id="desc">A current task searches candidates, loads one past experience, applies it, and records a reusable lesson.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="1120" height="260" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <text x="560" y="38" font-size="20" font-weight="700" fill="#0f172a">Search lightly. Load deliberately. Record only reusable lessons.</text>
    <g font-size="15" font-weight="650" fill="#0f172a">
      <rect x="40" y="92" width="150" height="66" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="115" y="132">Current Task</text>
      <rect x="230" y="92" width="150" height="66" rx="14" fill="#ede9fe" stroke="#a78bfa"/><text x="305" y="122">memory_search</text><text x="305" y="143" font-size="12" fill="#475569">keywords only</text>
      <rect x="420" y="92" width="150" height="66" rx="14" fill="#fef3c7" stroke="#f59e0b"/><text x="495" y="122">Candidates</text><text x="495" y="143" font-size="12" fill="#475569">no body / no score</text>
      <rect x="610" y="92" width="150" height="66" rx="14" fill="#ede9fe" stroke="#a78bfa"/><text x="685" y="122">memory_get</text><text x="685" y="143" font-size="12" fill="#475569">one full record</text>
      <rect x="800" y="92" width="150" height="66" rx="14" fill="#dcfce7" stroke="#4ade80"/><text x="875" y="122">Past Lesson</text><text x="875" y="143" font-size="12" fill="#475569">success or failure</text>
      <rect x="895" y="190" width="185" height="48" rx="12" fill="#fee2e2" stroke="#fb7185"/><text x="988" y="220">memory_record → block file</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M190 125H225"/><path d="M380 125H415"/><path d="M570 125H605"/><path d="M760 125H795"/><path d="M875 158V185H985"/></g>
    <text x="560" y="202" font-size="14" fill="#475569">Session stores what happened. Experience Memory stores what is worth reusing.</text>
  </g>
</svg>
