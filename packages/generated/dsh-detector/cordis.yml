# Load the Detector role directly into the host composition (dsh web or an
# acceptance runtime) for verification: the root agent becomes a Detector and
# the experiment-state tools appear in the same layer. The dsh base profile
# already provides the filesystem tools and the spawn subagent provider, so
# only the role plugin, the experiment-store plugin, and the explorer agent
# are inserted, all by direct file URL (the generated-plugin loading pattern —
# bare names do not resolve for these packages). Real orchestration mounts the
# preset directory (agent.cordis.yml + preset.yml) through a coordinator plugin
# instead; this overlay is the self-contained verification/demo form.
- insert:
    - id: detector
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-detector/lib/index.js'
      config:
        provider: spawn
        maxDepth: 3
        persona: true

    - id: experiment-state
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-experiment-state/lib/index.js'

    - id: explorer-agent
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-explorer-agent/lib/index.js'