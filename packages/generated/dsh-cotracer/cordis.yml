# CoTracer composition: load the trace skill plugin plus the three
# infrastructure plugins it orchestrates into the host composition (dsh web
# or an acceptance runtime). All rows load by direct file URL (the
# generated-plugin loading pattern — bare names do not resolve for these
# packages). The dsh base profile already provides the filesystem tools and
# the spawn subagent provider.
#
# The detector row loads WITHOUT its persona (`persona: false`): the main
# agent keeps its own identity and only gains the `delegate_experiment` tool
# and the shared `experimentExecutor` service, which `experiment_create` with
# `executor: "detector"` resolves to start Detector subagents automatically.
- insert:
    - id: cotracer
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-cotracer/lib/index.js'

    - id: explorer-agent
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-explorer-agent/lib/index.js'

    - id: experiment-state
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-experiment-state/lib/index.js'

    - id: detector
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-detector/lib/index.js'
      config:
        provider: spawn
        maxDepth: 3
        persona: false