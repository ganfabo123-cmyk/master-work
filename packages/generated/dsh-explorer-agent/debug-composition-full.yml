# Debug composition for the smoke: mirrors the acceptance composition (agent-spine
# + llm base with the acceptance overlay applied). The overlay carries the plugin,
# the subagent seam, and the fs tool suites as direct file URLs — no package-name
# resolution involved (the temp-cordis-sub-agent.yml pattern).
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext: false

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go:
        apiKeyEnv: open_code_api

- insert:
    - id: explorer-agent
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/generated/dsh-explorer-agent/lib/index.js'

    - id: subagent
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/subagent/subagent/lib/index.js'

    - id: subagent-spawn
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/subagent/subagent-spawn-in-process/lib/index.js'
      config:
        providerName: spawn

    - id: subagent-fork
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/subagent/subagent-fork-in-process/lib/index.js'
      config:
        providerName: fork

    - id: fs-sandbox
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/fs/fs-sandbox/lib/index.js'

    - id: sandbox-policy
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/sandbox/sandbox-policy/lib/index.js'

    - id: tool-fs
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/fs/tool-fs/lib/index.js'

    - id: tool-fs-search
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/fs/tool-fs-search/lib/index.js'
      config:
        sampleOverCapGlobResults: false

    - id: subprocess
      name: 'file:///D:/PycharmProjects/CodeHarness/harness/deepseek-harness/packages/subprocess/subprocess-local/lib/index.js'