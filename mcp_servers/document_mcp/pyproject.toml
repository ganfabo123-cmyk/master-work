[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codeharness-document-mcp"
version = "0.1.0"
description = "A real MCP server for hybrid native-text and OCR PDF parsing."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "pillow>=11,<13",
    "pypdf>=6,<7",
    "rapidocr-onnxruntime>=1.2,<2",
]

[project.scripts]
document-mcp = "document_mcp.server:main"

[tool.setuptools]
package-dir = { document_mcp = "." }
packages = ["document_mcp", "document_mcp.engines"]
